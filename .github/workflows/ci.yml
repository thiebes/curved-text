name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - name: Set up Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Install with linting tools
        run: uv pip install --system -e ".[test]" ruff mypy
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Install
        run: uv pip install --system -e ".[test]"
      - name: Run tests
        run: pytest -q

  # The matplotlib floor declared in pyproject.toml. Mathtext support relies on
  # get_glyphs_mathtext, Path.code_type, and the parse_math kwarg, all present
  # since 3.5; pin the floor and prove the suite passes against it.
  floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - name: Set up Python 3.9
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.9"
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Install with floor matplotlib
        # matplotlib 3.5 predates numpy 2.0 and is ABI-incompatible with it, so
        # the only valid environment for the floor pins numpy below 2. A user on
        # matplotlib 3.5 is on numpy 1.x for the same reason; curved-text itself
        # works with either numpy major version.
        run: uv pip install --system -e ".[test]" "matplotlib==3.5.*" "numpy<2"
      - name: Run tests
        run: pytest -q

  # Non-blocking early warning. curved-text is listed in matplotlib's
  # third-party registry, so surface upstream breakage from a matplotlib
  # pre-release here before users meet it.
  prerelease:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - name: Set up Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Install with pre-release matplotlib
        run: |
          uv pip install --system -e ".[test]"
          uv pip install --system --upgrade --prerelease=allow matplotlib
      - name: Run tests
        run: pytest -q
