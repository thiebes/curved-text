name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # TeX packages for the usetex tests, defined once for every job that installs
  # LaTeX so the jobs cannot drift apart. matplotlib's usetex preamble loads
  # type1cm (texlive-latex-extra) and type1ec (cm-super). Outlines are read from
  # the DVI file, so dvipng and dvips are not needed. lmodern and
  # texlive-fonts-recommended (Times and Helvetica) let the valign tests run
  # their preamble-font cases.
  TEX_PACKAGES: texlive-latex-extra cm-super lmodern texlive-fonts-recommended

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - name: Set up Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Install with linting tools
        run: uv pip install --system -e ".[test]" ruff mypy
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy src

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Install
        run: uv pip install --system -e ".[test]"
      - name: Run tests
        run: pytest -q

  # The matplotlib floor declared in pyproject.toml. Mathtext support relies on
  # get_glyphs_mathtext, Path.code_type, and the parse_math kwarg, and usetex
  # support on TextToPath.get_glyphs_tex, the TextToPath.FONT_SCALE attribute,
  # TexManager.make_dvi, and the height and descent of a dviread.Dvi page, all
  # present since 3.5; pin the floor and prove the suite passes against it.
  floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - name: Set up Python 3.9
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.9"
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Install with floor matplotlib
        # matplotlib 3.5 predates numpy 2.0 and is ABI-incompatible with it, so
        # the only valid environment for the floor pins numpy below 2. A user on
        # matplotlib 3.5 is on numpy 1.x for the same reason; curved-text itself
        # works with either numpy major version.
        run: uv pip install --system -e ".[test]" "matplotlib==3.5.*" "numpy<2"
      - name: Install LaTeX
        # The usetex tests skip without latex and kpsewhich, so install TeX
        # here, where it proves the usetex path against the oldest matplotlib,
        # and in the prerelease job for the newest.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $TEX_PACKAGES
      - name: Check the usetex toolchain
        # Render through the same TextToPath call the library uses, including
        # the escaped markup characters it emits, so a missing TeX package fails
        # here rather than only in the usetex tests. The valign tests skip a
        # preamble font whose files are missing, so check those files here too,
        # where a missing one fails instead of turning its cases into skips.
        run: |
          python - <<'EOF'
          import subprocess
          from matplotlib.font_manager import FontProperties
          from matplotlib.textpath import TextToPath
          s = r"a\% \textless{}\textgreater{}\textbar{}\textbackslash{}\textasciitilde{} $\sqrt{x}$"
          verts, _ = TextToPath().get_text_path(FontProperties(), s, ismath="TeX")
          assert len(verts) > 0
          files = ["cmtt12.pfb", "lmodern.sty", "lmss17.pfb", "times.sty",
                   "utmr8a.pfb", "helvet.sty", "uhvr8a.pfb"]
          for name in files:
              found = subprocess.run(["kpsewhich", name], capture_output=True,
                                     text=True).stdout.strip()
              assert found, f"kpsewhich cannot find {name}"
          EOF
      - name: Run tests
        run: pytest -q

  # Non-blocking early warning. curved-text is listed in matplotlib's
  # third-party registry, so surface upstream breakage from a matplotlib
  # pre-release here before users meet it.
  prerelease:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - name: Set up Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - name: Install with pre-release matplotlib
        run: |
          uv pip install --system -e ".[test]"
          uv pip install --system --upgrade --prerelease=allow matplotlib
      - name: Install LaTeX
        # The usetex path goes through TextToPath.get_glyphs_tex and
        # matplotlib's DVI reader, whose behavior changes between releases, so
        # run the usetex tests against the newest matplotlib too. A package
        # missing here fails the usetex tests rather than skipping them, so the
        # floor job's toolchain check is not repeated.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $TEX_PACKAGES
      - name: Run tests
        run: pytest -q
