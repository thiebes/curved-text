name: Docs build

# The documentation build, shared by the docs workflow, which publishes the
# site, and by the docs job in ci.yml, which builds it on every pull request.
# Defining it once means the pull-request check always builds exactly what
# publishes. It needs only read access: the Pages credentials belong to the
# deploy job in docs.yml alone.
on:
  workflow_call:
    inputs:
      upload-pages-artifact:
        description: Upload the built site as the Pages artifact for deploy.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.13"
      - name: Install with docs dependencies
        # The published site is built here, so its dependencies and the
        # setuptools build backend come pinned with hashes from
        # .github/requirements/docs.txt. The project itself has no hash, so it
        # is installed in a second step with --no-index, which downloads
        # nothing: pip must satisfy the docs extra and the runtime dependencies
        # from the pinned set, and fails if the lock no longer does.
        # --no-build-isolation builds with the pinned setuptools, and
        # --check-build-dependencies fails if it no longer meets the
        # [build-system] floor.
        run: |
          python -m pip install --require-hashes -r .github/requirements/docs.txt
          python -m pip install --no-index --no-build-isolation --check-build-dependencies -e ".[docs]"
      - name: Build the documentation
        # Treat warnings as errors so a broken reference fails the build.
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - if: inputs.upload-pages-artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: docs/_build/html
