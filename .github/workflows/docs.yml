name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# No permissions by default; each job asks for only what it needs.
permissions: {}

# One Pages deployment at a time; let a newer run finish rather than cancelling.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build with read access only, through the same reusable workflow the docs
  # job in ci.yml uses, so the build that publishes is the one pull requests
  # check.
  build:
    uses: ./.github/workflows/docs-build.yml
    permissions:
      contents: read
    with:
      upload-pages-artifact: true

  # Only this job holds the Pages credentials. It runs no project code: it
  # deploys the artifact the build job uploaded.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
