name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write    # OIDC token for PyPI trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"
      - name: Check the tag matches the package version
        # A tag that disagrees with pyproject.toml would build an older version,
        # which skip-existing would then pass over without an error. A manual
        # run from a branch has no version tag at all. Stop both here.
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::ref ${GITHUB_REF_NAME} does not match version v${version} in pyproject.toml"
            exit 1
          fi
      - name: Build distribution
        # build and the setuptools backend come pinned with hashes from
        # .github/requirements/publish.txt; --no-isolation builds with that
        # setuptools instead of an unpinned one fetched into an isolated env.
        run: |
          python -m pip install --require-hashes -r .github/requirements/publish.txt
          python -m build --no-isolation
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          # Re-running a partially-failed release skips already-uploaded files
          # instead of erroring on the immutable version.
          skip-existing: true

  # Separate job so the GitHub release carries only contents:write, never the
  # OIDC token that mints PyPI credentials. Runs only after publish succeeds.
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Create the GitHub release from the matching CHANGELOG section (falling
      # back to generated notes), updating it in place if a re-run already made
      # it. gh is preinstalled on the runner, so there is no extra action to pin.
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$(awk -v header="## ${version}" '
            $0 == header {capture = 1; next}
            /^## / && capture {exit}
            capture {print}
          ' CHANGELOG.md)"
          has_notes="$(printf '%s' "$notes" | tr -d '[:space:]')"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            cmd=(gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME")
            [ -n "$has_notes" ] && cmd+=(--notes "$notes")
          else
            cmd=(gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME")
            if [ -n "$has_notes" ]; then
              cmd+=(--notes "$notes")
            else
              cmd+=(--generate-notes)
            fi
          fi
          "${cmd[@]}"
